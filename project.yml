# XcodeGen spec — source of truth for the Memoree project.
#
# The generated Memoree.xcodeproj IS committed (see .gitignore) so that
# contributors can open and build without installing XcodeGen. Regenerate
# after any change here:
#
#     xcodegen generate
#
# Tracked per docs/TRD.md §2.

name: Memoree

options:
  bundleIdPrefix: com.javohirmx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR

targets:
  Memoree:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Memoree
    dependencies:
      - target: MemoreeWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Memoree
        PRODUCT_BUNDLE_IDENTIFIER: com.javohirmx.memoree
        INFOPLIST_FILE: Memoree/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Memoree/Resources/Memoree.entitlements
        CODE_SIGN_STYLE: Automatic
        # The team of the Apple ID actually signed in to this machine, which is
        # the `OU` on the local "Apple Development" certificate — not the
        # ten-character identifier in the certificate's common name, which is
        # the same value only for organisation teams. Signing fails with
        # "No Account for Team" when these disagree, so a wrong value here
        # cannot be worked around by passing -allowProvisioningUpdates.
        #
        # Read it rather than copying it out of the common name, which says
        # `(6VU7H3YG5W)` and is the *individual* identifier:
        #
        #     security find-certificate -c "Apple Development: <you>" -p \
        #         | openssl x509 -noout -subject
        #     subject=UID=UJ239AQ3NZ, CN=Apple Development: javohirmx@gmail.com
        #         (6VU7H3YG5W), OU=MBBD9BRZ67, …
        #
        # The two differ by one character, and a simulator build never signs —
        # so the wrong value survives every local test run and only fails when
        # someone finally tries a device.
        DEVELOPMENT_TEAM: MBBD9BRZ67
        CODE_SIGN_IDENTITY: Apple Development
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; iPad not optimised (PRD §6.3)
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Dark only is enforced in code, not by asset catalogs. Declared here so
        # the build system does not inject a light appearance expectation.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MemoreeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoreeWidget
      - path: Memoree/Support/WidgetAppGroup.swift
      - path: Memoree/Support/WidgetSnapshot.swift
      - path: Memoree/Support/WidgetSnapshotStore.swift
      - path: Memoree/Support/WidgetCameraHandoff.swift
      - path: Memoree/Support/CaptureMomentIntent.swift
    settings:
      base:
        PRODUCT_NAME: MemoreeWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.javohirmx.memoree.widget
        INFOPLIST_FILE: MemoreeWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MemoreeWidget/MemoreeWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MBBD9BRZ67
        CODE_SIGN_IDENTITY: Apple Development
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  MemoreeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoreeTests
    dependencies:
      - target: Memoree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.javohirmx.memoree.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Same team as the app, and it must be the same team: the test bundle
        # is injected into Memoree.app, so a mismatch here is not caught at
        # build time — it fails at "unable to install" with a message that
        # names the app rather than the bundle.
        DEVELOPMENT_TEAM: MBBD9BRZ67

schemes:
  Memoree:
    build:
      targets:
        Memoree: all
        MemoreeWidget: all
        MemoreeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MemoreeTests
